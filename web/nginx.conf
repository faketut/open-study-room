# Open Study Room web client — static SPA server.
# Consumed by web/Dockerfile. Serves the Vite build from
# /usr/share/nginx/html with SPA fallback so client-side routes resolve
# to index.html.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache-busted Vite assets (dist/assets/*) are immutable; HTML is not.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

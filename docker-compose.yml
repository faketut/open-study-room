services:
  livekit:
    # The /rtc/v1 path that livekit-client 2.5.x requires landed in a recent
    # server release. Both v1.7 and v1.8 return 404 here ("v1 RTC path not
    # found"). Using `latest` keeps us in sync with the JS SDK.
    image: livekit/livekit-server:latest
    # `--config` overrides `--dev`'s auto STUN-discovered node IP, which
    # otherwise leaks the corporate proxy egress IP into ICE candidates and
    # breaks local WebRTC. See livekit.yaml for rationale.
    command: --dev --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"   # signaling (WebSocket)
      - "7881:7881"   # TCP fallback
      - "7882:7882/udp"
    restart: unless-stopped
    healthcheck:
      # `--dev` exposes /healthz on the signaling port; opening a TCP socket
      # to 7880 is enough to confirm the SFU is accepting connections.
      test: ["CMD-SHELL", "nc -z localhost 7880 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  server:
    build:
      context: ./server
    depends_on:
      livekit:
        condition: service_healthy
    environment:
      # NOTE: this URL is echoed back to clients in /v1/sessions responses;
      # clients dial it directly, so it MUST be reachable from the client.
      #   - Browser on this host        → ws://localhost:7880  (default below)
      #   - Physical phone on the LAN   → ws://<your-LAN-IP>:7880 (override env)
      # The backend itself never connects to LiveKit; it only signs JWTs, so
      # there's no harm in not pointing at the internal docker hostname.
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      PORT: 8787
      DB_PATH: /data/syncle.db
      TOKEN_TTL_SECONDS: "3600"
      LOG_LEVEL: info
    volumes:
      - ./server/data:/data
    ports:
      - "8787:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8787/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build:
      # Context is the REPO ROOT (not ./web): the web `prebuild` step syncs
      # shared assets from ../assets and the moderation wordlist from
      # ../server, so both must be visible at their repo-relative paths.
      # See web/Dockerfile.
      context: .
      dockerfile: web/Dockerfile
      args:
        # NOTE: baked into the bundle at BUILD time (Vite inlines VITE_* vars
        # into the JS). Default works when your browser runs on this host.
        # Phone on the LAN? Rebuild with the host's LAN IP, e.g.:
        #   VITE_BACKEND_URL=http://192.168.1.42:8787 docker compose up --build web
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8787}
    # nginx only serves static files; it just needs the backend to be up so the
    # client can reach it. `service_started` is enough.
    depends_on:
      server:
        condition: service_started
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      # nginx:alpine ships busybox wget; `/` proves the SPA is being served.
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
